# Base y reporte locales del laboratorio TP2.
database_in=file:/srv/tp2/aide/aide.db
database_out=file:/srv/tp2/aide/aide.db.new
report_level=added_removed_entries
report_url=stdout

# Permisos, tipo, inode, enlaces, propietario, grupo, tamaño, tiempos y SHA-256.
TP2NORMAL = p+ftype+i+l+n+u+g+s+a+m+c+sha256

# El signo = limita la regla al directorio indicado y sus descendientes.
=/srv/tp2/datos/ TP2NORMAL
